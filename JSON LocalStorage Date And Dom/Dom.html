<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dom</title>
</head>
<body>
  <div class="my-div">This is the dom</div>
  
  
  <script>
    let button = document.createElement('Button');
    button.innerText = 'Click me';
    document.querySelector('.my-div').appendChild(button);

    document.querySelector('.my-div').removeChild(button
      
    );


  </script>
</body>
</html>
