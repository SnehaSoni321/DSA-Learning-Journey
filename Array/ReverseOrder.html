<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
</head>
<body>

  <script>
    // Create a for loop that prints number 1 to 10 in reverse order.
    for(let i = 10; i > 0; i--){
      console.log(i);
    }

    for(let i = 0; i < 10; i++){
      console.log(10 - i);
    }
  </script>
  
</body>
</html>
