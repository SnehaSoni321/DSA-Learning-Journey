<body>
  <script>
    // Create a while loop that exits after counting 5 prime number.

    function isPrime(num){
      for(let i = 2; i<num; i++){
        if(num % i === 0){
          return false;
        }
      }

      return true;
    }
    let num = 2;
    let count = 0;
   while(true){
    if(isPrime(num)){
      console.log(num)
      count++;
      if(count >= 5) break;
    }
    num++;
   }


  </script>
  
</body>
</html>
