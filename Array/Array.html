<!DOCTYPE html>
<html lang="en">
<head>
  <title>Array</title>
</head>
<body>
  
  <script>
      let numbers = [1,4,3,7,
        6,5,7,2];
        console.log(numbers);
        console.log(numbers[5]);

        let doosra = [1, true, null, 'asdsdwe'];
        console.log(doosra[3]);
        console.log(typeof doosra);

        let obj = {num: 98};

        //find the array
        console.log(Array.isArray(doosra));
        console.log(Array.isArray(obj));


        // push and pop
        let arr = [1,2,3];
        console.log(arr);
        arr.push(6);
        console.log(arr);

        // let popped = arr.pop();
        console.log('popped ' + arr.pop());
        console.log(arr);
        console.log('popped' + arr.pop());
        console.log(arr);

        let newArray = [5, 6,3,7];
        console.log("his is new " + newArray)
        // shift/unshift
        console.log('shift '+ newArray.shift());
        console.log(newArray);
        console.log('unshift ' + newArray.unshift());
        console.log(newArray)


      
        // splice -> kis index se delete karna start karu or kaha tak delete karu
        let arr2 = [3,5,7,9,6,8];
        console.log(arr2)
        arr2.splice(1,2);
        console.log(arr2)


        // toString -> array ke ander kon kon se element h usko string mei dikhana

        let arr1 = [3,5,2,4];
        console.log(arr1.toString());

        // sort -> array ko sort karna 
        let arr3 = [8,5,9,2];
        console.log(arr3);
        arr3.sort();
        console.log(arr3)

        // valueOf -> kind of array ki copy banane ke liye
        console.log( arr3.valueOf());
        //arry also use reference like object
        let arr4 = arr3;
        arr3[0] = 99;
        console.log(arr3)

        //De-Structuring also works for Arrays

        let [a,b,c,d] = arr3;
        console.log(a + " " + b + " " + c + " " + d) 


  </script>
</body>
</html>
