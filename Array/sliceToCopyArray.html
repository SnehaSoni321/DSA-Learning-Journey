  <script>

    // Create an array copy using slice method
   function arrCopy(arr) {
    return arr.slice(0, arr.length);
   }

   let arr  = [4,5,6,7];
   let arr2 = arrCopy(arr);
   arr2[0] = null;
   console.log(arr);
   console.log(arr2);
