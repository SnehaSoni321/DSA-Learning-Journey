<!DOCTYPE html>
<html lang="en">
<head>
  <title>Arrow Function</title>
</head>
<body>
  <script>
    // normal function
    // let sum = function(num1, num2) {
    //   return num1 + num2;
    // }
    // console.log(sum(6,8));

     let sum = (num1, num2) => {
      return num1 + num2;
    }
    console.log(sum(6,8));

    // single argument mei round brackets optional
    let square = num => {
      return num * num;
    }
    console.log(square(5));

    // agar apka methord bhi single line ka h to curly brackets and return optional

     let square1 = num => num * num;
     let sum2 = (num1, num2) => num1 + num2;

    console.log(square1(6));
    console.log(sum2(7,9));
  </script>
  
</body>
</html>
