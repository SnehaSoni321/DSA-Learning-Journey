<!DOCTYPE html>
<html lang="en">
<head>
  <title>Event Listener</title>
</head>
<body>
  <button id="my-button" >Click me</button>

  <button id="btn">Nice</button>

<script>
    let buttonElement = document.querySelector('#my-button');
    buttonElement.addEventListener('click', event => console.log('I am clicked'));



    // 
    let btnCall = event => console.log('I am Nice');
      // Multiple Listeners: You can add more than one
    let myBtn = document.querySelector('#btn');
    myBtn.addEventListener('click', btnCall)

    let printFDate = event => console.log(new Date());
    myBtn.addEventListener('click', printFDate);

    // removeEventListener('event', functionVariable)
       myBtn.removeEventListener('click', printFDate);
  </script>
  
</body>
</html>
